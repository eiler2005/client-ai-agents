# Шаблон коммерческого предложения. Создавайте копию командой
# `assess new <идентификатор> --kind proposal`.
#
# Что здесь важно знать:
# — раздел «О компании» в КП не пишется руками: он собирается из
#   src/content/company.yaml, где у каждой цифры есть источник и дата;
# — `offerings`, `about.facts` и `about.proof` — это идентификаторы из того же профиля;
#   услуги или кейса, которых там нет, в предложении не будет;
# — если КП идёт после обследования, укажите `project.assessment` — в раздел
#   «Понимание задачи» подтянутся решение, пробелы и опора из оценки;
# — имена сотрудников заказчика не пишем, только роли;
# — пока статус `draft`, допущения, цены и сроки можно не заполнять. На `final`
#   проверка потребует стоимость, срок действия, команду, допущения и условие
#   перехода (gate) у каждого этапа.

id: ЗАМЕНИТЕ-ИДЕНТИФИКАТОР
version: 1
status: draft # draft | review | final
date: ЗАМЕНИТЕ-ДАТУ
valid_until: ЗАМЕНИТЕ-ДАТУ

client:
  name: ЗАПОЛНИТЕ заказчика
  industry: banking # banking | insurance | pharma | medicine | manufacturing
  contact_role: ЗАПОЛНИТЕ роль адресата, без имени

project:
  name: ЗАПОЛНИТЕ название работ
  summary: >-
    ЗАПОЛНИТЕ: что предлагаем сделать и зачем. Два-три предложения, которые адресат
    прочитает первыми и по которым примет решение читать дальше.
  # assessment: идентификатор-оценки   # если КП идёт после обследования

context:
  problem: >-
    ЗАПОЛНИТЕ: в чём задача заказчика, своими словами и с цифрами, которые он сам назвал.
  goals:
    - ЗАПОЛНИТЕ цель
  metrics:
    - name: ЗАПОЛНИТЕ метрику
      baseline: "—"
      target: "—"

scope:
  in:
    - ЗАПОЛНИТЕ, что входит в работы
  out:
    - ЗАПОЛНИТЕ, что не входит и почему

# Идентификаторы услуг из src/content/company.yaml:
# llm-platform, agents, products, sdd, mcp, legacyops
offerings:
  - agents

stages:
  - id: s1
    name: ЗАПОЛНИТЕ название этапа
    weeks: 3
    goal: ЗАПОЛНИТЕ цель этапа
    activities:
      - ЗАПОЛНИТЕ работу
    deliverables:
      - ЗАПОЛНИТЕ результат, который можно принять
    gate: ЗАПОЛНИТЕ условие перехода к следующему этапу
    price: "—"

team:
  - role: Product Engineer
    count: 1
    load: 100 %
    note: ЗАПОЛНИТЕ зону ответственности

commercials:
  model: fixed # fixed | tm | pilot | mixed
  total: "—"
  terms:
    - ЗАПОЛНИТЕ условие оплаты
  assumptions:
    - ЗАПОЛНИТЕ допущение, на котором построена оценка срока и стоимости

risks:
  - title: ЗАПОЛНИТЕ риск проекта
    mitigation: ЗАПОЛНИТЕ, что делаем, чтобы он не сработал

# Чем подкрепляем предложение. Если не указать, подберутся кейсы по отрасли клиента.
about:
  # facts: [founded, revenue, rating-bank]
  # proof: [code-security, sales-coach]
  clients: true
  platform: true

next_steps:
  - ЗАПОЛНИТЕ следующий шаг
