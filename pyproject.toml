[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "aiagents-review"
version = "0.2.0"
description = "Оценка проектов ИИ-агентов Синимекс и коммерческие предложения: рубрика, скоринг, отчёт и КП в PDF"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6,<7", "jsonschema>=4.23,<5"]

[project.scripts]
assess = "assess.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
pdf = ["reportlab>=4.2,<5", "markdown-it-py>=3,<4", "pypdf>=5,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["assess"]

[tool.hatch.build.targets.wheel]
packages = ["src/assess"]
