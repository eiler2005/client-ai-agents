name: checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.6"
      - run: uv sync --frozen --group dev --group pdf
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q
      - name: Рубрика, профиль компании и образцы
        run: |
          uv run assess --demo check
          uv run assess --demo build
      - name: Печать отчёта и предложения по образцам
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core librsvg2-bin
          uv run assess --demo pdf --out dist/pdf-ci
          uv run assess --demo proposal --out dist/kp-ci
      - name: В репозитории нет данных клиентов
        run: .githooks/privacy-check tree
