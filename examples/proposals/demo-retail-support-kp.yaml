# Показательное коммерческое предложение. Данные вымышлены целиком, цены условны.
# Предложение продолжает оценку examples/assessments/demo-retail-support.yaml: именно
# так эти два документа и должны работать вместе — КП закрывает пробелы, которые нашло
# обследование, и ссылается на его выводы, а не на прайс-лист.

id: demo-retail-support-kp
version: 1
status: final
date: 2026-10-06
valid_until: 2026-11-21

client:
  name: Демо-Банк
  industry: banking
  contact_role: Директор дистанционного обслуживания

project:
  name: Вывод агента поддержки за пределы пилотной группы
  assessment: demo-retail-support
  summary: >-
    Предлагаем закрыть три пробела, которые сегодня держат агента поддержки на 4 %
    чат-потока, и подготовить его к работе на всём розничном канале: ограничить доступ к
    данным правами клиента, поставить эвалы в конвейер выпуска и связать базу знаний с
    выпуском изменений продукта. Работы разбиты на четыре этапа по 3–5 недель, каждый
    заканчивается результатом, который можно принять и проверить отдельно.
  authors:
    - Денис Ермилов

context:
  problem: >-
    Агент работает на пилотной группе восемь недель и закрывает 22 % обращений без
    оператора при цели 35 %. Расширять пилот в текущем виде нельзя: агент читает данные
    розничных клиентов под одной технической учётной записью, изоляция сделана в коде, а
    не в правах; провокационные обращения в нашем прогоне в трёх случаях из двенадцати
    раскрыли системную инструкцию, в одном — привели к записи в чужое обращение.
    Регрессии после правок промпта находят операторы через несколько дней.
  goals:
    - Снять ограничение на расширение пилота за счёт контура безопасности агента
    - Сделать качество измеримым до выпуска, а не после жалобы клиента
    - Довести долю обращений без оператора до целевых 35 % на расширенной группе
    - Посчитать стоимость закрытого обращения и уложить её в целевой диапазон
  metrics:
    - name: Доля обращений, закрытых без оператора
      baseline: 22 % на пилотной группе
      target: 35 % на расширенной группе
    - name: Доля провокационных обращений, обработанных корректно
      baseline: 9 из 12 в нашем прогоне
      target: 100 % на наборе из 20 сценариев в конвейере
    - name: Время обнаружения регрессии качества
      baseline: несколько дней, через операторов
      target: до выпуска, прогоном эвалов
    - name: Стоимость закрытого обращения
      baseline: не считалась
      target: не выше 12 ₽
      note: при текущей цене обращения оператором 46 ₽

scope:
  in:
    - Перевод доступа агента к данным на права клиента в контексте обращения
    - Набор тестов на промпт-инъекции и его встраивание в конвейер выпуска
    - Эталонный набор обращений, эвалы с блокирующим порогом в CI
    - Связка выпуска изменений продукта с переиндексацией базы знаний
    - Расчёт стоимости закрытого обращения по телеметрии и суточные лимиты
    - Трассировка вызовов инструментов и алерты по деградации
  out:
    - Голосовой канал — отдельный проект банка
    - Контур корпоративных клиентов
    - Нагрузочное тестирование корпоративной шины — зона команды интеграций банка
    - Изменения в core-системе — выполняет владелец системы

offerings:
  - agents
  - mcp
  - sdd

stages:
  - id: s1
    name: Контур безопасности агента
    weeks: 4
    goal: Снять ограничение, которое сегодня не даёт расширять пилот.
    activities:
      - "Модель доступа: агент читает и пишет под правами клиента в контексте обращения"
      - Набор из 20 провокационных сценариев, включая инъекции во вложениях
      - Подтверждение вторым шагом для операций записи
      - Журналирование прочитанных данных, а не только выполненных действий
    deliverables:
      - Работающая модель доступа с прогоном, подтверждающим недостижимость чужих данных
      - Набор тестов на инъекции в репозитории проекта
      - Заключение по журналированию для службы информационной безопасности
    gate: Прогон на чужих идентификаторах возвращает отказ на уровне прав
    price: 2 400 000 ₽
  - id: s2
    name: Эвалы в конвейере выпуска
    weeks: 4
    goal: Сделать так, чтобы регрессию находил прогон, а не оператор.
    activities:
      - Эталонный набор из реальных обращений с критериями приёмки
      - Прогон эвалов в CI с порогом, блокирующим выпуск
      - Запись версии промпта и модели в телеметрию каждого обращения
      - Регламент пополнения набора разобранными боевыми диалогами
    deliverables:
      - Эталонный набор не менее 200 обращений с разметкой
      - Конвейер выпуска с блокирующим порогом качества
      - Связка «диалог — версия промпта» в телеметрии
    gate: Искусственно ухудшенная версия промпта останавливается конвейером
    price: 2 100 000 ₽
  - id: s3
    name: Знания и экономика обращения
    weeks: 5
    goal: Убрать ответы по устаревшим условиям и понять цену масштабирования.
    activities:
      - Переиндексация базы знаний по событию изменения продукта
      - Дата актуальности источника в ответе клиенту
      - Метрика свежести индекса в дашборде дежурного
      - Расчёт стоимости закрытого обращения по телеметрии с повторами
      - Суточные бюджетные лимиты и прогноз на десятикратный поток
    deliverables:
      - Связка выпуска продукта с индексом, подтверждённая на двух изменениях тарифа
      - Отчёт по стоимости закрытого обращения и прогноз на боевой объём
      - Лимиты, срабатывающие в прогоне
    gate: Изменение тарифа доходит до ответа агента в день публикации
    price: 2 600 000 ₽
  - id: s4
    name: Вывод за пилотную группу
    weeks: 3
    goal: Передать решение в эксплуатацию банка на расширенной группе.
    activities:
      - Трассировка до вызовов инструментов
      - Алерты по доле переводов оператору и по задержке ответа
      - Регламент дежурства и разбор первого инцидента вместе с командой банка
      - Передача документации и парное владение сборкой контекста
    deliverables:
      - Сквозная трассировка обращения и набор алертов
      - Регламент реагирования, согласованный с эксплуатацией банка
      - Расширение пилота на согласованную долю чат-потока
    gate: Две недели работы на расширенной группе без инцидентов уровня «высокий»
    price: 1 500 000 ₽

team:
  - role: Product Engineer
    count: 1
    load: 60 %
    note: Сценарии, эвалы, приёмка результата, работа с заказчиком процесса
  - role: AI Engineer
    count: 2
    load: 100 %
    note: Агентный контур, инструменты, эвалы, наблюдаемость, CI
  - role: Архитектор информационной безопасности
    count: 1
    load: 40 %
    note: Модель доступа, тесты на инъекции, согласование с ИБ банка
  - role: Руководитель проекта
    count: 1
    load: 30 %
    note: План, статусы, управление изменениями объёма

commercials:
  model: fixed
  total: 8 600 000 ₽, без НДС
  terms:
    - Оплата поэтапно, по подписании акта за этап
    - Каждый этап принимается по своему условию перехода, указанному в плане
    - Изменение объёма оформляется дополнительным соглашением до начала работ
  assumptions:
    - Доступ к тестовому контуру и телеметрии предоставляется в первую неделю этапа
    - Со стороны банка выделены владелец решения и представитель службы ИБ
    - Изменения в core-системе выполняет её владелец в согласованные сроки
    - Модель остаётся в контуре банка; смена контура меняет оценку сроков
    - Разметку эталонного набора на 40 % выполняют операторы банка

risks:
  - title: Согласование модели доступа со службой ИБ затянется дольше этапа
    mitigation: >-
      Начинаем согласование на первой неделе, параллельно готовим второй вариант с
      изоляцией на уровне сервиса-владельца данных.
  - title: Эталонного набора не хватит для статистически значимого порога
    mitigation: >-
      Порог вводится в два шага: сначала как предупреждение, после накопления данных —
      как блокирующий.
  - title: Расширение пилота упрётся в пропускную способность шины
    mitigation: >-
      Прогноз нагрузки готовим на третьем этапе и передаём команде интеграций до выхода
      на расширенную группу.

about:
  clients: true
  platform: true

next_steps:
  - Обсудить предложение и уточнить допущения на встрече в течение недели
  - Согласовать состав эталонного набора и доступ к телеметрии
  - Зафиксировать дату старта первого этапа и ответственных со стороны банка
