# Вторая показательная оценка: черновик с неполным охватом. Данные вымышлены.
# Нужна, чтобы проверять поведение сборки на статусе `draft` (неоцененные измерения,
# радар без замкнутого контура) и чтобы в портфеле было с чем сравнивать.

id: demo-logistics-intake
version: 1
rubric_version: 1
status: draft

project:
  name: Агент разбора заявок на перевозку
  client: Демо-Логистика
  client_code: ДЛ-02
  sponsor: Руководитель отдела приёма заявок
  stage: discovery
  pattern: rag-assistant
  started: 2026-08-18
  assessed: 2026-10-02
  assessors:
    - Денис Ермилов
  summary: >-
    Заявки на перевозку приходят письмами в свободной форме, с вложениями от двух строк
    до таблицы на сотню позиций. Идея проекта: агент читает письмо, достаёт параметры
    перевозки и заполняет черновик заявки, оператор подтверждает. На момент оценки
    существует прототип на 200 письмах и ни одного замера на боевом потоке.
  scope:
    in:
      - Прототип разбора письма и заполнения черновика заявки
      - Выборка 200 писем, на которой прототип собирали
    out:
      - Интеграция с транспортной системой — не начата
      - Вложения в виде сканов — отложены до решения по OCR
  stack:
    Модели:
      - внешняя модель для разбора письма
    Оркестрация:
      - скрипты, сервиса пока нет
  metrics:
    - name: Доля заявок, заполненных без правок оператора
      baseline: 0 %
      target: 60 %
      actual: не замерялась
      note: прототип считали на обучающей выборке, отдельного набора для проверки нет

sources:
  - id: s1
    kind: interview
    title: Интервью с руководителем отдела приёма заявок
    date: 2026-09-30
    confidence: high
  - id: s2
    kind: demo
    title: Демонстрация прототипа на десяти письмах
    date: 2026-10-01
    confidence: high
  - id: s3
    kind: document
    title: Выборка 200 писем и разметка полей заявки
    date: 2026-10-01
    confidence: medium

scores:
  business-value:
    level: 2
    confidence: high
    finding: >-
      Процесс и его владелец названы: отдел принимает порядка 400 заявок в день, на
      разбор письма уходит 6–9 минут. Целевое значение заявлено, базовое время замерено
      по наблюдению за двумя сотрудниками в течение дня, а не по системным данным.
    evidence: [s1]
    risk: Эффект посчитан на наблюдении за двумя сотрудниками и может не повториться на отделе.
    recommendation: Взять время разбора из журнала транспортной системы за месяц.
    criteria:
      bv-problem: 3
      bv-metric: 2
      bv-alternative: 1

  agent-fit:
    level: 2
    confidence: medium
    finding: >-
      Вариативность письма подтверждена выборкой: 200 писем дают 30 форм записи адреса и
      11 способов указать габариты. Но задача на деле — извлечение полей, а не выбор
      шагов: агентность здесь нужна только для вложений, формат которых заранее не
      известен. Фиксированное извлечение на правилах не пробовали.
    evidence: [s2, s3]
    risk: >-
      Агент может оказаться дороже и сложнее в поддержке, чем извлечение полей моделью
      без свободы шагов.
    recommendation: >-
      Сравнить с простым извлечением полей на том же наборе: если разница в качестве мала,
      агентная схема не нужна.
    criteria:
      af-variability: 3
      af-autonomy: 2
      af-simpler: 0

  data-knowledge:
    level: 1
    confidence: medium
    finding: >-
      Выборка 200 писем собрана вручную одним аналитиком за две недели, владельца у неё
      нет, обновляться не предполагается. Разметка полей сделана тем же человеком без
      второго проверяющего.
    evidence: [s3]
    risk: Качество прототипа измерено на разметке одного человека и может быть завышено.
    recommendation: >-
      Развести выборку на обучающую и проверочную, разметить проверочную вторым
      аналитиком вслепую.
    criteria:
      dk-sources: 1
      dk-quality: 1
      dk-retrieval: 1

  evaluation:
    level: 1
    confidence: high
    finding: >-
      Качество считалось на той же выборке, на которой прототип настраивали. Отдельного
      проверочного набора нет, прогон запускается вручную из ноутбука.
    evidence: [s2, s3]
    risk: >-
      Заявленная точность прототипа не подтверждена ни на одном письме, которого он не
      видел при настройке.
    recommendation: >-
      Выделить 60 писем в проверочный набор, не показывать их при настройке, прогон
      вынести в скрипт с фиксацией результата.
    criteria:
      ev-dataset: 1
      ev-pipeline: 0
      ev-online: 0

  security:
    level: 1
    confidence: low
    finding: >-
      Письма клиентов уходят во внешнюю модель; согласование этого с службой безопасности
      заказчика на момент оценки не получено. Что именно в письмах считается
      персональными данными, не разбиралось.
    evidence: [s1]
    risk: >-
      Проект может остановиться на согласовании после того, как в него вложат квартал
      работы.
    recommendation: >-
      Получить позицию службы безопасности до начала разработки: контур модели определяет
      всю дальнейшую архитектуру.
    criteria:
      se-access: 1
      se-injection: 0
      se-compliance: 1

  human-loop:
    level: 2
    confidence: medium
    finding: >-
      Схема работы предполагает подтверждение оператором каждой заявки, экран подтверждения
      нарисован. Как оператор будет понимать, откуда агент взял значение поля, не решено.
    evidence: [s1, s2]
    recommendation: >-
      Показывать в черновике фрагмент письма, из которого взято поле: без этого проверка
      превращается в повторный разбор письма.
    criteria:
      hl-handoff: 2
      hl-override: 2
      hl-adoption: 1

risks:
  - id: r1
    title: Внешняя модель не будет согласована службой безопасности заказчика
    dimension: security
    probability: high
    impact: high
    mitigation: Получить позицию до разработки, держать в запасе вариант модели в контуре.
    owner: Руководитель проекта со стороны Синимекс
    due: 2026-10-31
  - id: r2
    title: Точность прототипа завышена из-за проверки на обучающей выборке
    dimension: evaluation
    probability: high
    impact: medium
    mitigation: Проверочный набор из 60 писем с независимой разметкой.
    owner: Аналитик проекта
    due: 2026-11-07

actions:
  - id: a1
    title: Получить позицию службы безопасности по контуру модели
    horizon: 30
    dimension: security
    effort: s
    impact: high
    owner: Руководитель проекта со стороны Синимекс
    outcome: Письменная позиция, определяющая, где может работать модель.
  - id: a2
    title: Выделить проверочный набор с независимой разметкой
    horizon: 30
    dimension: evaluation
    effort: m
    impact: high
    owner: Аналитик проекта
    outcome: Качество прототипа измерено на письмах, которых он не видел.
  - id: a3
    title: Сравнить агентную схему с простым извлечением полей
    horizon: 60
    dimension: agent-fit
    effort: m
    impact: medium
    owner: Разработчик прототипа
    outcome: Решение об агентной схеме принято по разнице в качестве, а не по умолчанию.

verdict:
  rationale: >-
    Задача реальная и считается, но проект пока не прошёл двух проверок, после которых
    только и имеет смысл планировать разработку: позиции безопасности по контуру модели и
    качества на письмах, которых прототип не видел. Оценка остаётся черновиком: шесть
    измерений из двенадцати на стадии исследования оценивать нечем.
  conditions:
    - Позиция службы безопасности по контуру модели получена письменно.
    - Качество прототипа подтверждено на независимом проверочном наборе.

highlights:
  - >-
    Процесс стоит разбора: 400 заявок в день по 6–9 минут на письмо, владелец процесса
    в проекте участвует.
  - >-
    Точность прототипа измерена на той же выборке, на которой он настраивался, то есть
    пока не измерена.
  - >-
    Главный риск не технический: письма клиентов уходят во внешнюю модель без позиции
    службы безопасности заказчика.
