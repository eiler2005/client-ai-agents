scores:
  business-value:
    level: 3
    confidence: high
    finding: >-
      Заказчик процесса назван и участвует в проекте еженедельно. Метрика выбрана одна,
      доля обращений без оператора, база замерена до пилота по тому же каналу, целевое
      значение согласовано на управляющем комитете. Факт за восемь недель — 22 % против
      цели 35 %, расхождение разобрано по типам обращений.
    strength: >-
      Проект считает одну метрику и показывает её на тех же данных, на которых мерили
      базу, — спорить можно о причинах, а не о цифрах.
    evidence: [s2, s5]
    risk: >-
      Экономия пока считается в обращениях, а не в деньгах: при пересчёте в стоимость
      эффект может оказаться вдвое ниже ожидания комитета.
    recommendation: >-
      Свести эффект в деньги вместе с финансовой службой до решения о тираже.
    criteria:
      bv-problem: 4
      bv-metric: 3
      bv-alternative: 2

  agent-fit:
    level: 3
    confidence: high
    finding: >-
      Команда начинала с дерева сценариев и дошла до агента после разбора 300 реальных
      обращений: в 41 % случаев клиент смешивал два вопроса в одном сообщении, и
      фиксированный маршрут ломался. Автономия ограничена: четыре операции с явными
      правами, всё остальное уходит оператору.
    strength: >-
      Свобода отдана модели там, где ветки заранее не перечислить, и только там.
    evidence: [s1, s3, s4]
    recommendation: >-
      Зафиксировать границу автономии в документе проекта, чтобы при расширении списка
      операций её расширяли осознанно, а не по инерции.
    criteria:
      af-variability: 4
      af-autonomy: 3
      af-simpler: 3

  economics:
    level: 2
    confidence: medium
    finding: >-
      Телеметрия токенов и вызовов инструментов собирается по каждому обращению, но в
      стоимость закрытого обращения не сведена: в расчётах фигурирует средняя цена
      запроса без повторов и без вызовов инструментов. Лимит на число шагов в диалоге
      есть и срабатывал; бюджетного лимита на сутки нет.
    evidence: [s5, s1]
    risk: >-
      На боевом объёме при сохранении доли повторов стоимость обращения может превысить
      целевую, и это выяснится после тиража, а не до него.
    recommendation: >-
      Посчитать стоимость закрытого обращения по телеметрии со всеми повторами, добавить
      суточный бюджетный лимит и прогноз на десятикратный поток.
    criteria:
      ec-unit: 2
      ec-budget: 2
      ec-scale: 1

  data-knowledge:
    level: 2
    confidence: high
    finding: >-
      База знаний продуктов живёт в Confluence, индекс пересобирается по расписанию раз
      в сутки. Владелец базы — продуктовое подразделение, но регламента обновления при
      изменении условий продукта нет: в пилоте дважды агент отвечал по тарифу, который
      изменился четыре дня назад. Полнота поиска измерялась один раз на 50 вопросах.
    evidence: [s1, s6, s7]
    risk: >-
      Устаревший ответ по тарифу в розничном канале — это не только недовольный клиент,
      но и обращение в надзорный орган.
    recommendation: >-
      Связать выпуск изменений продукта с переиндексацией, добавить в ответ дату
      актуальности источника и метрику свежести индекса в дашборд дежурного.
    criteria:
      dk-sources: 3
      dk-quality: 1
      dk-retrieval: 2

  architecture:
    level: 3
    confidence: high
    finding: >-
      Границы разведены: агент не пишет в core-систему напрямую, все четыре операции
      идут через сервисы-владельцы по корпоративной шине, контракты описаны и
      версионируются. Повторная отправка операции проверялась — операции идемпотентны по
      ключу обращения. Описания инструментов лежат в коде и покрыты тестами.
    strength: >-
      Интеграции сделаны через штатные интерфейсы, поэтому замена модели не затрагивает
      системы банка.
    evidence: [s4, s6, s3]
    criteria:
      ar-boundaries: 3
      ar-tools: 3
      ar-state: 3

  models-context:
    level: 2
    confidence: medium
    finding: >-
      Выбор модели обоснован требованием держать данные в контуре банка, сравнение с
      двумя альтернативами проводилось на 60 обращениях по качеству и задержке, но без
      стоимости. Промпты лежат в репозитории, однако привязки версии промпта к диалогу в
      телеметрии нет: воспроизвести ответ, который агент дал месяц назад, нельзя.
    evidence: [s1, s4, s5]
    risk: >-
      Без связи «диалог — версия промпта» разбор инцидента превращается в догадки, а
      регрессию после правки промпта невозможно доказать.
    recommendation: >-
      Писать версию промпта и модели в телеметрию каждого обращения; это день работы и
      основа для всей будущей отладки.
    criteria:
      mc-choice: 3
      mc-context: 2
      mc-versioning: 1

  security:
    level: 1
    confidence: high
    finding: >-
      Агент работает под одной технической учётной записью с правами на чтение данных
      всех розничных клиентов: изоляция по клиенту сделана в коде агента, а не в правах
      доступа. Промпт-инъекции обсуждались, но не проверялись: в нашем прогоне 12
      провокационных обращений в 3 случаях агент раскрыл содержимое системной инструкции,
      а в 1 случае выполнил запись в чужое обращение по номеру из текста клиента.
      Журнал действий ведётся, но без записи того, какие данные агент прочитал.
    evidence: [s4, s6, s7]
    risk: >-
      Межклиентский доступ в розничном канале — это инцидент с персональными данными,
      уведомление регулятора и остановка пилота.
    recommendation: >-
      Перевести доступ на права конкретного клиента в контексте обращения, добавить набор
      тестов на инъекции в конвейер и дописать в журнал прочитанные данные. Это условие
      выхода за пределы пилотной группы.
    criteria:
      se-access: 1
      se-injection: 0
      se-compliance: 2

  evaluation:
    level: 1
    confidence: high
    finding: >-
      Эталонный набор есть — 120 обращений с ожидаемым результатом, собранных вручную в
      начале проекта и с тех пор не пополнявшихся. Прогон запускается руками перед
      выпуском, порога нет, результат никуда не записывается. Качество на боевом потоке
      оценивается ручным разбором 20 диалогов в день силами двух операторов.
    evidence: [s1, s4, s5]
    risk: >-
      Регрессия после правки промпта обнаруживается операторами через несколько дней,
      а не прогоном за несколько минут. На тираже это станет основным источником
      инцидентов.
    recommendation: >-
      Поставить прогон эвалов в конвейер с порогом, блокирующим выпуск, и пополнять набор
      разобранными боевыми диалогами каждую неделю.
    criteria:
      ev-dataset: 2
      ev-pipeline: 0
      ev-online: 1

  reliability:
    level: 2
    confidence: medium
    finding: >-
      Логи пишутся, сквозная трассировка обращения собирается, но не включает вызовы
      инструментов: восстановить, что именно агент запросил в core-системе, можно только
      по логам шины. Поведение при отказе модели проверено — клиент переводится на
      оператора с сохранением контекста. Дежурства нет: о сбоях узнают от операторов.
    evidence: [s1, s5]
    risk: >-
      Деградация качества без падения сервиса сейчас не детектируется вообще.
    recommendation: >-
      Дотянуть трассировку до вызовов инструментов и добавить алерты по доле обращений,
      ушедших оператору, и по задержке ответа.
    criteria:
      re-observability: 2
      re-fallback: 3
      re-ops: 1

  human-loop:
    level: 3
    confidence: high
    finding: >-
      Передача оператору сделана хорошо: оператор видит весь диалог, предложенный ответ
      и причину остановки, может отменить операцию агента, отмена попадает в журнал.
      Операторы пользуются агентом добровольно, доля отказов от его предложений за восемь
      недель упала с 34 % до 19 %. Обратная связь оператора собирается в свободной форме
      и в эвалы не возвращается.
    strength: >-
      Интерфейс оператора спроектирован под перехват, а не под наблюдение, и это видно по
      динамике доверия.
    evidence: [s2, s3, s5]
    recommendation: >-
      Завести у обратной связи операторов структурированную причину отказа и забирать её
      в эталонный набор.
    criteria:
      hl-handoff: 4
      hl-override: 3
      hl-adoption: 3

  delivery:
    level: 2
    confidence: medium
    finding: >-
      Команда — четыре человека, знания о сборке контекста и промптах сосредоточены у
      одного разработчика. Со стороны банка владелец решения после сдачи не назван.
      Выпуск автоматизирован частично: код идёт конвейером, промпты и описания
      инструментов правятся отдельным ручным шагом.
    evidence: [s1, s4]
    risk: >-
      Уход одного человека останавливает развитие решения на несколько недель.
    recommendation: >-
      Назвать владельца со стороны банка, вынести промпты в тот же конвейер, что и код,
      и завести парное владение сборкой контекста.
    criteria:
      de-ownership: 1
      de-release: 2
      de-skills: 2

  governance:
    level: 1
    confidence: medium
    finding: >-
      Реестра рисков по проекту нет, риски обсуждаются на еженедельной встрече и живут в
      протоколах. Решение о выборе локальной модели зафиксировано в презентации комитета,
      остальные архитектурные решения — только в переписке. Стоимость замены модели не
      оценивалась.
    evidence: [s1, s2]
    risk: >-
      При смене состава команды или комитета основания прошлых решений восстановить будет
      не из чего.
    recommendation: >-
      Завести реестр рисков с владельцами и журнал решений; на тираже это становится
      обязательным.
    criteria:
      go-risks: 1
      go-decisions: 1
      go-lockin: 0

risks:
  - id: r1
    title: Межклиентский доступ из-за широких прав технической учётной записи
    dimension: security
    probability: high
    impact: high
    mitigation: >-
      Перевести чтение данных на права клиента в контексте обращения; до этого держать
      пилот в пределах текущей группы.
    owner: Руководитель информационной безопасности банка
    due: 2026-11-14
  - id: r2
    title: Исполнение инструкции из текста клиента (промпт-инъекция)
    dimension: security
    probability: high
    impact: high
    mitigation: >-
      Набор тестов на инъекции в конвейере выпуска, подтверждение операций записи вторым
      шагом.
    owner: Технический лид проекта
    due: 2026-11-28
  - id: r3
    title: Ответ по устаревшим условиям продукта
    dimension: data-knowledge
    probability: medium
    impact: high
    mitigation: >-
      Переиндексация по событию изменения продукта и дата актуальности в ответе клиенту.
    owner: Владелец базы знаний продуктов
    due: 2026-12-12
  - id: r4
    title: Стоимость обращения выше целевой на боевом объёме
    dimension: economics
    probability: medium
    impact: medium
    mitigation: >-
      Расчёт по телеметрии с повторами и суточный бюджетный лимит до решения о тираже.
    owner: Руководитель проекта со стороны Синимекс
    due: 2026-11-28
  - id: r5
    title: Потеря знаний при уходе ключевого разработчика
    dimension: delivery
    probability: medium
    impact: medium
    mitigation: Парное владение сборкой контекста и описание в репозитории проекта.
    owner: Руководитель проекта со стороны Синимекс
    due: 2027-01-16

actions:
  - id: a1
    title: Перевести доступ агента на права клиента в контексте обращения
    horizon: 30
    dimension: security
    effort: m
    impact: high
    owner: Технический лид проекта
    outcome: Запрос чужих данных возвращает отказ на уровне прав, а не проверки в коде.
  - id: a2
    title: Добавить набор тестов на промпт-инъекции в конвейер выпуска
    horizon: 30
    dimension: security
    effort: s
    impact: high
    owner: Технический лид проекта
    outcome: 20 провокационных обращений проходят при каждом выпуске, падение блокирует его.
  - id: a3
    title: Писать версию промпта и модели в телеметрию обращения
    horizon: 30
    dimension: models-context
    effort: s
    impact: medium
    owner: Разработчик агента
    outcome: По любому диалогу восстанавливается версия промпта, которой он отвечен.
  - id: a4
    title: Поставить прогон эвалов в конвейер с блокирующим порогом
    horizon: 60
    dimension: evaluation
    effort: m
    impact: high
    owner: Технический лид проекта
    outcome: Выпуск не проходит при падении качества на эталонном наборе ниже порога.
  - id: a5
    title: Связать выпуск изменений продукта с переиндексацией базы знаний
    horizon: 60
    dimension: data-knowledge
    effort: m
    impact: high
    owner: Владелец базы знаний продуктов
    outcome: Изменение тарифа попадает в индекс в день публикации, в ответе видна дата.
  - id: a6
    title: Свести эффект пилота в деньги с финансовой службой
    horizon: 60
    dimension: economics
    effort: s
    impact: medium
    owner: Руководитель дистанционного обслуживания
    outcome: Стоимость закрытого обращения и экономия на пилотной группе в рублях.
  - id: a7
    title: Дотянуть трассировку до вызовов инструментов и завести алерты
    horizon: 90
    dimension: reliability
    effort: m
    impact: medium
    owner: Инженер эксплуатации банка
    outcome: Обращение восстанавливается целиком; рост доли переводов оператору даёт алерт.
  - id: a8
    title: Назвать владельца решения со стороны банка и завести журнал решений
    horizon: 90
    dimension: governance
    effort: s
    impact: medium
    owner: Директор дистанционного обслуживания
    outcome: У решения есть владелец, у каждого архитектурного выбора — запись с основанием.

verdict:
  rationale: >-
    Замысел проекта подтверждён: агентный подход здесь оправдан, архитектура и работа
    человека в контуре сделаны на уровне, которого обычно не видно на пилоте, метрика
    считается честно. Пилот при этом нельзя расширять в текущем виде: доступ к данным
    клиентов не ограничен правами, инъекции не проверяются, а регрессии ловятся
    операторами вручную. Это те три пробела, которые после тиража закрываются в десять
    раз дороже.
  conditions:
    - Доступ агента ограничен правами клиента в контексте обращения, подтверждено прогоном.
    - Тесты на промпт-инъекции и эвалы работают в конвейере и блокируют выпуск при падении.
    - Переиндексация базы знаний связана с выпуском изменений продукта.
    - Стоимость закрытого обращения посчитана по телеметрии и уложена в целевую.

highlights:
  - >-
    Агентный подход оправдан и подтверждён разбором 300 обращений: в 41 % случаев клиент
    смешивает два вопроса, и фиксированный маршрут ломается.
  - >-
    Архитектура и передача оператору сделаны лучше, чем обычно бывает на пилоте: операции
    идут через сервисы-владельцы, оператор перехватывает агента без потери контекста.
  - >-
    Три пробела держат проект на пилотной группе: права доступа к данным клиентов,
    непроверенные промпт-инъекции и отсутствие эвалов в конвейере выпуска.
  - >-
    Эффект посчитан в обращениях, но не в деньгах: решение о тираже сейчас принимается
    без стоимости закрытого обращения.
