# Показательная оценка. Данные вымышлены целиком: ни заказчика «Демо-Банк», ни этого
# проекта не существует. Файл нужен, чтобы сборка и печать проверялись на полном
# наборе полей, и чтобы было с чего списывать формулировки при заполнении настоящей
# оценки. Настоящие оценки лежат в assessments/ и в репозиторий не попадают.

id: demo-retail-support
version: 1
rubric_version: 1
status: final

project:
  name: Агент поддержки розничных клиентов
  client: Демо-Банк
  client_code: ДБ-01
  sponsor: Директор дистанционного обслуживания
  stage: pilot
  pattern: workflow-agent
  started: 2026-04-13
  assessed: 2026-09-26
  assessors:
    - Денис Ермилов
  summary: >-
    Агент принимает обращения розничных клиентов в чате мобильного приложения, отвечает
    по базе знаний продуктов и выполняет четыре операции в системах банка: выписку по
    счёту, статус заявки на карту, смену лимита и запись в отделение. На момент оценки
    агент работал на пилотной группе около 4 % входящего чат-потока, в рабочие часы,
    с обязательным ручным разбором спорных диалогов на следующий день.
  scope:
    in:
      - Чат-канал мобильного приложения и сценарии четырёх операций
      - База знаний продуктов и маршрут поиска по ней
      - Интеграции с core-системой и системой заявок через корпоративную шину
      - Телеметрия пилота за восемь недель
    out:
      - Голосовой канал — запущен отдельным проектом
      - Контур корпоративных клиентов
      - Нагрузочное тестирование шины — проводит команда интеграций
  stack:
    Модели:
      - локальная модель на 32B для ответов
      - внешняя модель для классификации обращений
    Оркестрация:
      - собственный сервис на Python
      - очередь задач на Kafka
    Данные:
      - база знаний продуктов в Confluence
      - векторный индекс на pgvector
    Инфраструктура:
      - Kubernetes в контуре банка
      - корпоративная шина для интеграций
  metrics:
    - name: Доля обращений, закрытых без оператора
      baseline: 0 %
      target: 35 %
      actual: 22 %
      note: по пилотной группе за восемь недель
    - name: Среднее время ответа клиенту
      baseline: 4 мин 10 с
      target: до 40 с
      actual: 51 с
    - name: Стоимость закрытого обращения
      baseline: 46 ₽ оператором
      target: до 12 ₽
      actual: не считалась
      note: телеметрия токенов есть, в деньги не сведена

