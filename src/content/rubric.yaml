# Рубрика оценки проектов ИИ-агентов. Единственный источник правды для шкалы,
# измерений, весов и порогов решения. Меняется осознанно: после изменения весов или
# порогов прошлые оценки нужно пересобрать (`assess build`), иначе отчёты разъедутся
# с рубрикой, по которой их считали. Версию поднимать при любом изменении смысла.
version: 1
updated: 2026-10-06

# Уровень зрелости. Один набор формулировок на все измерения: в отчёте уровень
# означает одно и то же в любом разделе, и спорить можно о факте, а не о шкале.
scale:
  - level: 0
    id: absent
    name: Нет
    description: Практики нет, вопрос в проекте не поднимался.
  - level: 1
    id: initial
    name: Начальный
    description: Делается от случая к случаю, держится на одном человеке, нигде не описано.
  - level: 2
    id: repeatable
    name: Повторяемый
    description: Практика есть и повторяется, но описана не полностью; результат зависит от людей.
  - level: 3
    id: managed
    name: Управляемый
    description: Зафиксировано, измеряется, выполняется стабильно, есть владелец.
  - level: 4
    id: optimising
    name: Оптимизируемый
    description: Измеряется и улучшается по данным, выдерживает рост нагрузки и состава команды.

# Уверенность в оценке измерения. Низкая уверенность — это не низкий уровень:
# в отчёте она показывается отдельно, чтобы заказчик видел, где мы смотрели сами,
# а где поверили на слово.
confidence:
  - id: high
    name: Высокая
    description: Видели своими глазами — код, прогон, телеметрия, артефакт.
  - id: medium
    name: Средняя
    description: Подтверждено документом или двумя независимыми собеседниками.
  - id: low
    name: Низкая
    description: Один источник или только слова; требует проверки.

# Решение по проекту. Считается по взвешенной оценке, но блокирующее измерение на
# уровне 0-1 не даёт подняться выше `fix`: нельзя рекомендовать продакшн там, где
# нет данных, эвалов или контроля доступа, какой бы ни была средняя.
verdicts:
  - id: go
    name: Идём
    min_score: 75
    description: Проект готов к следующему шагу в текущем виде; риски управляемы.
  - id: conditions
    name: Идём с условиями
    min_score: 60
    description: Следующий шаг возможен после выполнения перечисленных условий.
  - id: fix
    name: Сначала закрыть пробелы
    min_score: 40
    description: Есть пробелы, которые дешевле закрыть до масштабирования, чем после.
  - id: no_go
    name: Не идём в текущем виде
    min_score: 0
    description: Замысел или подход требуют пересмотра, а не доработки.

# Группы измерений: четыре вопроса, на которые отчёт отвечает по порядку.
groups:
  - id: value
    name: Ценность
    question: Стоит ли это делать и агентом ли?
  - id: solution
    name: Решение
    question: На чём это стоит и выдержит ли основание?
  - id: quality
    name: Качество
    question: Откуда мы знаем, что это работает?
  - id: delivery
    name: Поставка
    question: Кто это ведёт и чем управляет?

# Тип агентного решения. Влияет на то, какие измерения критичны: у автономного
# агента цена ошибки эвалов и контроля доступа несопоставима с ассистентом-подсказкой.
patterns:
  - id: assistant
    name: Ассистент-подсказка
    description: Отвечает человеку, действий в системах не совершает.
  - id: rag-assistant
    name: Ассистент на знаниях
    description: Отвечает по корпоративным документам, поиск плюс генерация.
  - id: workflow-agent
    name: Агент в процессе
    description: Выполняет шаги фиксированного процесса с инструментами и проверками.
  - id: multi-agent
    name: Несколько агентов
    description: Роли распределены между агентами, есть оркестратор.
  - id: autonomous
    name: Автономный агент
    description: Сам выбирает шаги и действует в системах заказчика без шага подтверждения.

# Стадия проекта на момент оценки. Задаёт планку: от discovery не ждут эвалов,
# от production их отсутствие — находка.
stages:
  - id: discovery
    name: Исследование
    description: Идея и контур задачи; решения ещё нет.
  - id: pilot
    name: Пилот
    description: Работает на ограниченном контуре и ограниченной группе.
  - id: mvp
    name: MVP
    description: Боевой контур, узкий объём, ручное сопровождение.
  - id: production
    name: Промышленная эксплуатация
    description: Боевая нагрузка, SLA, дежурство.
  - id: scaled
    name: Масштабирование
    description: Несколько процессов или подразделений на одной платформе.

dimensions:
  - id: business-value
    group: value
    weight: 3
    name: Ценность и бизнес-кейс
    short: Ценность
    question: Какую измеримую проблему закрывает агент и кто за это отвечает?
    anchors:
      0: "Пользы никто не сформулировал; проект существует как эксперимент с технологией."
      2: "Польза названа словами, метрика выбрана, но базовое значение не замерено."
      4: "Метрика, базовое значение и целевое согласованы с заказчиком процесса, факт отслеживается."
    criteria:
      - id: bv-problem
        name: Проблема и её владелец
        probe: Чей процесс болит, кто из бизнеса подписывается под результатом?
        evidence: Названы процесс, роль заказчика и его решение, которое агент меняет.
      - id: bv-metric
        name: Метрика и база
        probe: По какому числу поймём, что стало лучше, и чему оно равно сегодня?
        evidence: Метрика с замером до внедрения, а не оценка «на глаз».
      - id: bv-alternative
        name: Альтернатива
        probe: Что будет, если ничего не делать или сделать без ИИ?
        evidence: Сравнение с ручным процессом или классической автоматизацией в тех же числах.

  - id: agent-fit
    group: value
    weight: 3
    name: Применимость агентного подхода
    short: Агентность
    question: Нужен ли здесь агент или задача решается проще и надёжнее?
    anchors:
      0: "Агент выбран как технология до разбора задачи; тот же результат даёт скрипт или поиск."
      2: "Агентность оправдана частично: часть шагов можно было зафиксировать процессом."
      4: "Свобода решения отдана модели ровно там, где перечислить варианты заранее нельзя."
    criteria:
      - id: af-variability
        name: Вариативность задачи
        probe: Можно ли перечислить ветки процесса заранее?
        evidence: Разбор нескольких реальных обращений, где фиксированный маршрут ломается.
      - id: af-autonomy
        name: Степень автономии
        probe: Какие действия агент совершает сам и где стоит подтверждение?
        evidence: Список инструментов с правами и явной границей автономии.
      - id: af-simpler
        name: Простое решение проверено
        probe: Пробовали ли сначала поиск, шаблон или фиксированный процесс?
        evidence: Результат простого варианта в тех же метриках и причина отказа от него.

  - id: economics
    group: value
    weight: 2
    name: Экономика и масштабирование
    short: Экономика
    question: Сколько стоит обращение и что произойдёт с ценой на боевом объёме?
    anchors:
      0: "Стоимость обращения неизвестна, бюджет не ограничен."
      2: "Средняя стоимость считается постфактум, лимитов и прогноза на объём нет."
      4: "Стоимость обращения в бюджете, есть лимиты, прогноз на объём и план её снижения."
    criteria:
      - id: ec-unit
        name: Стоимость обращения
        probe: Сколько стоит один успешно закрытый кейс со всеми повторами и инструментами?
        evidence: Расчёт по телеметрии токенов и вызовов, а не по цене за миллион токенов.
      - id: ec-budget
        name: Лимиты и защита от разгона
        probe: Что остановит стоимость при цикле или всплеске нагрузки?
        evidence: Лимиты на шаги и бюджет, срабатывавшие в прогоне.
      - id: ec-scale
        name: Поведение на объёме
        probe: Что станет с задержкой и ценой при десятикратном потоке?
        evidence: Нагрузочный прогон или расчёт с названными допущениями.

  - id: data-knowledge
    group: solution
    weight: 3
    blocking: true
    name: Данные и знания
    short: Данные
    question: На каких данных работает агент, кто за их качество отвечает?
    anchors:
      0: "Источники не описаны, знания собраны выгрузкой вручную."
      2: "Источники известны, обновление ручное, качество никто не измеряет."
      4: "Источники с владельцами и регламентом обновления, полнота и актуальность измеряются."
    criteria:
      - id: dk-sources
        name: Источники и владельцы
        probe: Откуда берутся знания и кто отвечает за каждый источник?
        evidence: Перечень источников с системой-владельцем и ответственным подразделением.
      - id: dk-quality
        name: Качество и актуальность
        probe: Как узнаём, что ответ построен на устаревшем документе?
        evidence: Метрика свежести или полноты и случай, когда она сработала.
      - id: dk-retrieval
        name: Готовность к поиску
        probe: Разбиение, метаданные, права — проверялись ли на реальных запросах?
        evidence: Измеренная полнота поиска на наборе реальных вопросов.

  - id: architecture
    group: solution
    weight: 2
    name: Архитектура и интеграции
    short: Архитектура
    question: Как агент устроен и как он разговаривает с системами заказчика?
    anchors:
      0: "Схемы нет, интеграции сделаны по месту, границы ответственности не определены."
      2: "Архитектура описана, часть интеграций обходит штатные интерфейсы."
      4: "Границы и контракты зафиксированы, интеграции идут через поддерживаемые интерфейсы."
    criteria:
      - id: ar-boundaries
        name: Границы и контракты
        probe: Что внутри агента, что в системах-владельцах, где контракт между ними?
        evidence: Схема с контрактами интеграций и их владельцами.
      - id: ar-tools
        name: Инструменты агента
        probe: Как описаны инструменты, что происходит при их ошибке?
        evidence: Описания инструментов со схемами ответов и разбором ошибочных случаев.
      - id: ar-state
        name: Состояние и идемпотентность
        probe: Что будет при повторе шага — двойная проводка или один результат?
        evidence: Прогон с повторной отправкой и неизменным результатом.

  - id: models-context
    group: solution
    weight: 2
    name: Модели и контекст
    short: Модели
    question: Почему выбраны эти модели и как собирается их контекст?
    anchors:
      0: "Модель выбрана по доступности, промпты правятся в проде без истории."
      2: "Выбор обоснован, промпты в репозитории, сравнения моделей на своих данных нет."
      4: "Выбор подтверждён замером на своих задачах, промпты и контекст версионируются."
    criteria:
      - id: mc-choice
        name: Выбор модели
        probe: Что сравнивали и по какому критерию выбрали?
        evidence: Таблица сравнения на собственных задачах с качеством, задержкой и ценой.
      - id: mc-context
        name: Сборка контекста
        probe: Что попадает в контекст, что отсекается и почему?
        evidence: Описание сборки контекста и его бюджета в токенах.
      - id: mc-versioning
        name: Версионирование промптов
        probe: Можно ли воспроизвести ответ, который агент дал месяц назад?
        evidence: Промпты и настройки под контролем версий со связью с прогонами.

  - id: security
    group: solution
    weight: 3
    blocking: true
    name: Безопасность, ПДн и соответствие
    short: Безопасность
    question: Что мешает агенту сделать то, чего он делать не должен?
    anchors:
      0: "Агент работает под широкими правами, вход не фильтруется, журнала действий нет."
      2: "Права ограничены, инъекции обсуждались, проверки точечные."
      4: "Права минимальны по задаче, инъекции проверяются в наборе тестов, действия в журнале."
    criteria:
      - id: se-access
        name: Права и изоляция
        probe: Под чьими правами агент читает и пишет, как ограничен доступ к данным?
        evidence: Модель доступа с проверкой, что чужие данные недостижимы.
      - id: se-injection
        name: Промпт-инъекции и недоверенный вход
        probe: Что происходит, когда инструкция приходит из документа или письма клиента?
        evidence: Тесты с инъекцией в данных и зафиксированное поведение агента.
      - id: se-compliance
        name: ПДн, журнал и требования
        probe: Какие персональные данные проходят через агента, где это зафиксировано?
        evidence: Перечень обрабатываемых данных, журнал действий и заключение по требованиям.

  - id: evaluation
    group: quality
    weight: 3
    blocking: true
    name: Оценка качества и эвалы
    short: Эвалы
    question: Откуда известно, что агент работает, и как ловятся регрессии?
    anchors:
      0: "Качество оценивается демонстрацией; набора примеров нет."
      2: "Есть набор примеров и ручная проверка, регулярности и порогов нет."
      4: "Эвалы в конвейере, пороги блокируют релиз, набор пополняется из боевых случаев."
    criteria:
      - id: ev-dataset
        name: Эталонный набор
        probe: На каких примерах проверяется агент и откуда они взялись?
        evidence: Набор из реальных обращений с ожидаемым результатом и критерием приёмки.
      - id: ev-pipeline
        name: Регулярность и пороги
        probe: Что произойдёт с релизом, если качество упадёт?
        evidence: Прогон эвалов в конвейере с порогом, который останавливал выпуск.
      - id: ev-online
        name: Оценка в бою
        probe: Как измеряется качество на реальном потоке, а не только на наборе?
        evidence: Метрика результата на боевом потоке и разбор выборки диалогов.

  - id: reliability
    group: quality
    weight: 2
    name: Надёжность и эксплуатация
    short: Надёжность
    question: Что происходит, когда что-то падает, и кто об этом узнаёт?
    anchors:
      0: "Наблюдаемости нет, об инцидентах узнают от пользователей."
      2: "Логи есть, трассировки частичные, дежурство неформальное."
      4: "Сквозные трассировки, алерты по признакам деградации, разобранные инциденты."
    criteria:
      - id: re-observability
        name: Наблюдаемость
        probe: Можно ли восстановить ход конкретного обращения целиком?
        evidence: Трассировка одного обращения со всеми вызовами и решениями.
      - id: re-fallback
        name: Поведение при отказе
        probe: Что видит пользователь, когда модель или инструмент недоступны?
        evidence: Проверенный сценарий отказа с передачей человеку.
      - id: re-ops
        name: Дежурство и инциденты
        probe: Кто реагирует, за какое время, что уже разбирали?
        evidence: Регламент реагирования и разбор хотя бы одного инцидента.

  - id: human-loop
    group: quality
    weight: 2
    name: Человек в контуре и принятие
    short: Человек
    question: Как человек проверяет, правит и перехватывает агента?
    anchors:
      0: "Передачи человеку нет или она теряет контекст; доверия у пользователей нет."
      2: "Передача работает, обратная связь собирается, в продукт не возвращается."
      4: "Перехват и правка встроены в интерфейс, обратная связь питает эвалы, принятие измеряется."
    criteria:
      - id: hl-handoff
        name: Передача человеку
        probe: Когда агент останавливается и что получает сотрудник?
        evidence: Правила передачи и экран, который видит сотрудник, с полным контекстом.
      - id: hl-override
        name: Правка и отмена
        probe: Может ли человек отменить действие агента и остаётся ли след?
        evidence: Механизм отмены и журнал правок.
      - id: hl-adoption
        name: Принятие пользователями
        probe: Пользуются ли агентом добровольно и что об этом говорят?
        evidence: Доля обращений через агента и причины отказа от него.

  - id: delivery
    group: delivery
    weight: 2
    name: Команда и процесс поставки
    short: Поставка
    question: Кто ведёт решение дальше и как в него вносят изменения?
    anchors:
      0: "Решение держится на одном человеке, выпуск ручной, владельца со стороны заказчика нет."
      2: "Команда названа, выпуск частично автоматизирован, знания у отдельных людей."
      4: "Роли и владелец закреплены, выпуск автоматизирован и воспроизводим, передача описана."
    criteria:
      - id: de-ownership
        name: Владение
        probe: Кто у заказчика владеет решением после сдачи?
        evidence: Названная роль со стороны заказчика и зафиксированная зона ответственности.
      - id: de-release
        name: Выпуск изменений
        probe: Как изменение промпта или инструмента попадает в бой?
        evidence: Конвейер выпуска с проверками и возможностью откатить.
      - id: de-skills
        name: Компетенции и передача
        probe: Что произойдёт, если ключевой разработчик уйдёт?
        evidence: Документация, парное владение или план передачи.

  - id: governance
    group: delivery
    weight: 1
    name: Управление и риски
    short: Управление
    question: Как принимаются решения о развитии и что сделано с рисками?
    anchors:
      0: "Риски не перечислены, решения принимаются по ходу, зависимость от поставщика не обсуждалась."
      2: "Риски перечислены, владельцев и сроков нет."
      4: "Риски с владельцами и сроками, решения фиксируются, зависимость от поставщика оценена."
    criteria:
      - id: go-risks
        name: Реестр рисков
        probe: Какие риски выписаны, у кого они на руках?
        evidence: Реестр с вероятностью, влиянием, владельцем и сроком.
      - id: go-decisions
        name: Решения и их след
        probe: Где записано, почему выбран этот подход?
