# Профиль Синимекс: единственный источник фактов о компании для КП, презентаций и
# писем клиенту. Правило здесь то же, что и в оценках: у каждой цифры и каждого
# утверждения есть источник с датой. Фраза без источника в коммерческое предложение
# не попадает — потому что именно её у нас и попросят подтвердить.
#
# Устаревание — отдельная история. Выручка и численность живут год, рейтинги дольше,
# цифры эффектов из кейсов — пока кейс не пересчитан. Поле `as_of` показывает, на
# какую дату факт верен; `assess company` предупредит о просроченных.
