# Что мы продаём. Идентификаторы используются в КП: `offer.offerings` перечисляет те,
# из которых собрано предложение.
offerings:
  - id: llm-platform
    name: Внедрение LLM-платформы on-prem
    summary: >-
      Развёртывание платформы и моделей под ключ в контуре заказчика, оптимизация
      inference на NVIDIA GPU — одиночные карты и multi-GPU кластеры, облако и on-premise.
    includes:
      - Развёртывание платформы и моделей под ключ
      - Оптимизация inference на NVIDIA GPU
      - Контур заказчика, облако или гибрид
    source: deck-llm
  - id: agents
    name: Разработка агентов и встраивание ИИ в процессы
    summary: >-
      Агенты под ключ, платформы автоматизации и multi-agent workflow, ИИ-функции внутри
      существующих продуктов, обучение и встраивание малых моделей.
    includes:
      - Разработка агентов под ключ
      - Внедрение платформ автоматизации ИИ и multi-agent workflow
      - Реализация ИИ-функций в существующих продуктах
      - Обучение и встраивание малых моделей в продукты и процессы
    source: deck-llm
  - id: products
    name: Готовые решения
    summary: >-
      То, что уже работает и переносится к заказчику быстрее разработки с нуля:
      inference-платформа, ИИ-агент для 1С, SmartCodeAnalyzer, сервис транскрибации.
    includes:
      - Inference-платформа
      - ИИ-агент для 1С
      - SmartCodeAnalyzer
      - Сервис транскрибации
    source: deck-llm
  - id: sdd
    name: Внедрение процессов SDD и ADLC
    summary: >-
      Обучение команд и выстраивание процесса разработки с агентами под ключ: OpenSpec,
      Spec Kit и собственный фреймворк спецификаций.
    includes:
      - Обучение команд
      - Выстраивание процессов под ключ
      - OpenSpec, Spec Kit, собственный фреймворк
    source: deck-llm
  - id: mcp
    name: Интеграция с enterprise-системами
    summary: >-
      Разработка MCP-серверов к корпоративным системам и навыков для агентов: агент
      получает доступ к данным и действиям через поддерживаемый интерфейс, а не в обход него.
    includes:
      - MCP-серверы к enterprise-системам
      - Навыки (tools) для агентов
    source: deck-llm
  - id: legacyops
    name: LegacyOps — модернизация legacy с ИИ-агентами
    summary: >-
      Анализ кода, восстановление спецификаций, поэтапная миграция, автотесты и проверка
      эквивалентности, CI/CD.
    includes:
      - Анализ кода и восстановление спецификаций (SDD)
      - Поэтапная миграция
      - Автотесты и проверка эквивалентности
      - CI/CD
    source: deck-llm

# Корпоративная ИИ-платформа: единая точка доступа к моделям в безопасном контуре.
platform:
  name: Корпоративная ИИ-платформа Синимекс
  summary: Единая точка доступа к моделям в безопасном контуре.
  source: deck-llm
  layers:
    - id: clients
      name: Клиенты
      items:
        - "Агенты: Opencode, Pi, Cursor, плагины к IDE"
        - "Готовые агенты: ИИ-агент для 1С, SmartCodeAnalyzer, сервис транскрибации"
        - "Чат: Open WebUI, боты в VK Teams"
    - id: control
      name: Управление
      items:
        - Роутинг на форке LiteLLM — управление доступами, маршрутизация, биллинг
        - Langfuse — трассировка, отладка, эвалы
        - Grafana, Prometheus, Superset — технические и бизнес-метрики использования
    - id: compute
      name: Вычисления
      items:
        - Собственные серверы с NVIDIA RTX A5000 на движке ollama
        - Выделенный сервер 4×NVIDIA H200 на vLLM у облачного провайдера
        - Открытые модели для генерации, кода и распознавания речи

stack:
  Оркестрация:
    - LangGraph
    - n8n
    - Кастомные пайплайны
  Данные и знания:
    - LlamaIndex
    - Qdrant
    - PostgreSQL
    - pgvector
  Запуск моделей:
    - vLLM в контуре заказчика
    - ollama
    - Облачные провайдеры
  Наблюдаемость:
    - Langfuse
    - OpenTelemetry
    - Grafana, Prometheus, Superset

integrations:
  - ERP
  - CRM
  - Сервисные системы
  - Системы управления документами
  - Корпоративные базы знаний
  - Платформы данных
  - Системы разработки
  - Микросервисные ландшафты

security:
  - Работа с закрытыми данными в контролируемом контуре
  - Локальный запуск моделей для данных, которые нельзя передавать во внешние сервисы
  - Разграничение доступа к данным и действиям агента
  - Корпоративные источники знаний вместо внешних
  - Участие сотрудника в критичных операциях
  - Журналирование и трассировка действий агента
  - Мониторинг качества и эффективности

