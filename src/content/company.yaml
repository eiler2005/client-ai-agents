# Методика выбора и подготовки сценария: то, с чего начинается работа с заказчиком.
method:
  - step: Определение владельца и цели
    description: Фиксируем ответственность, задачи и расчётный бизнес-эффект.
  - step: Анализ процесса
    description: Узкие места, ручные операции, потери времени и затрат.
  - step: Оптимизация процесса
    description: Убираем и упрощаем операции до применения ИИ, стандартизируем действия.
  - step: Выбор технологии
    description: >-
      Сравниваем правила и код, машинное обучение, работу с корпоративными знаниями,
      автоматизацию процессов и ИИ-агентов — агент выбирается, когда он выигрывает.
  - step: Определение приоритета
    description: Ранжирование по бизнес-ценности, сложности, рискам и доступности данных.
  - step: Расчёт экономики
    description: Сравнение текущего и оптимизированного процессов по времени, затратам и качеству.
  - step: Определение точек контроля
    description: Какие решения принимает агент, где проверяет и согласует сотрудник.
  - step: Формирование пилота
    description: Сценарии, показатели и критерии успеха до масштабирования.
method_output: >-
  Карта процесса, приоритетные сценарии, экономическая модель, архитектурная концепция и
  план пилота.
method_source: site-agents

delivery:
  - stage: Находим процесс
    description: Определяем, где эффект максимальный.
  - stage: Проектируем агента
    description: Архитектура, данные, интеграции, точки контроля.
  - stage: Запускаем пилот
    description: Проверка на реальных данных и измерение бизнес-показателей.
  - stage: Масштабируем
    description: Вывод в промышленный контур.
delivery_source: site-agents

# Команда. Небольшие команды, усиленные агентами, — то, как мы сегодня ведём заказную
# разработку.
roles:
  - id: product-engineer
    name: Product Engineer
    focus: Доменная экспертиза, насмотренность, UX, SDD, инженерный бэкграунд
